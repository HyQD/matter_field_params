[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HyQD-matter-field-params"
version = "0.0.0"
description = "Matter and electromagnetic field parameter tools"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.5.2,<2.6",
    "scipy>=1.18.0,<1.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["matter_field_params*"]
